name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dst
        uses: ./
        with:
          timezone: America/Chicago
          local-hour: "3"
          now: "2026-07-15T08:00:00Z"
      - run: test "${{ steps.dst.outputs.run }}" = "true"
      - id: off
        uses: ./
        with:
          timezone: America/Chicago
          local-hour: "3"
          now: "2026-07-15T09:00:00Z"
      - run: test "${{ steps.off.outputs.run }}" = "false"
